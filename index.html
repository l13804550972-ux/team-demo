<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="用于测试 GitHub Pages 发布流程的静态网页">
  <title>GitHub Pages 发布测试</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: rgba(15, 30, 49, 0.78);
      --line: rgba(148, 163, 184, 0.2);
      --text: #f8fafc;
      --muted: #a8b5c7;
      --accent: #6ee7b7;
      --accent-strong: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(52, 211, 153, 0.16), transparent 30rem),
        radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.12), transparent 28rem),
        var(--bg);
    }

    main {
      width: min(92%, 760px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(16px);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(110, 231, 183, 0.25);
      border-radius: 999px;
      color: var(--accent);
      background: rgba(52, 211, 153, 0.08);
      font-size: 14px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 0 16px var(--accent-strong);
    }

    h1 {
      margin: 24px 0 14px;
      font-size: clamp(36px, 8vw, 68px);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    .lead {
      max-width: 580px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 20px);
      line-height: 1.75;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 30px 0;
    }

    .item {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.025);
    }

    .item strong {
      display: block;
      margin-bottom: 5px;
      font-size: 15px;
    }

    .item span {
      color: var(--muted);
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      color: #052e24;
      background: var(--accent);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease;
    }

    button:hover { background: #a7f3d0; transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    #message {
      min-height: 24px;
      color: var(--accent);
      font-weight: 700;
    }

    footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 620px) {
      main { padding: 24px; border-radius: 22px; }
      .grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="status"><span class="dot" aria-hidden="true"></span>网页已成功加载</div>
    <h1>Hello, GitHub Pages.</h1>
    <p class="lead">
      如果团队成员能看到这个页面，说明 HTML 已经成功上传并通过 GitHub Pages 发布。
    </p>

    <section class="grid" aria-label="发布检查项目">
      <div class="item"><strong>HTML</strong><span>页面结构正常</span></div>
      <div class="item"><strong>CSS</strong><span>响应式样式正常</span></div>
      <div class="item"><strong>JavaScript</strong><span>点击按钮即可测试</span></div>
    </section>

    <div class="actions">
      <button id="testButton" type="button">测试交互</button>
      <span id="message" role="status" aria-live="polite"></span>
    </div>

    <footer>首次发布测试 · <span id="time"></span></footer>
  </main>

  <script>
    const time = document.querySelector('#time');
    const button = document.querySelector('#testButton');
    const message = document.querySelector('#message');

    time.textContent = new Intl.DateTimeFormat('zh-CN', {
      dateStyle: 'long',
      timeStyle: 'medium'
    }).format(new Date());

    button.addEventListener('click', () => {
      message.textContent = '测试成功，JavaScript 正常运行！';
      button.textContent = '已测试';
    });
  </script>
</body>
</html>
